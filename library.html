<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Pal library</title>
<link rel="stylesheet" href="mindmap.css">
<style>
  :root {
    --bg: #f6f6f8; --surface: #ffffff; --track: #ececef; --ink: #111114; --ink-2: #3a3a40; --muted: #5d5d64;
    --line: #e2e2e7; --accent: #e62117; --accent-hover: #c91a11; --accent-soft: rgba(230, 33, 23, .08);
    --link: #065fd4; --link-soft: rgba(6, 95, 212, .09); --good: #137333; --bad: #c5221f;
    --ease: cubic-bezier(.22, 1, .36, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f10; --surface: #1c1c1e; --track: #2c2c2f; --ink: #f1f1f3; --ink-2: #d2d2d6; --muted: #a3a3aa;
      --line: #313135; --accent: #e62117; --accent-hover: #f0342a; --accent-soft: rgba(255, 78, 69, .14);
      --link: #6cb4ff; --link-soft: rgba(108, 180, 255, .14); --good: #5fd08a; --bad: #ff7b72;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 "Roboto", "Helvetica Neue", Arial, sans-serif; }
  button, input { font: inherit; }
  :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .yta-ico { display: inline-flex; flex: none; }

  /* Top bar */
  .top {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 16px;
    padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; white-space: nowrap; }
  .logo { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff; }
  .brand small { color: var(--muted); font-weight: 500; font-size: 15px; }
  .search { flex: 1; max-width: 460px; height: 40px; padding: 0 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--bg); color: var(--ink); }
  .search::placeholder { color: var(--muted); }
  .due { margin-left: auto; color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .due strong { color: var(--accent); }
  .icon-btn { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 50%; background: transparent; color: var(--ink-2); cursor: pointer; }
  .icon-btn:hover { background: var(--track); }

  /* Layout */
  .layout { display: grid; grid-template-columns: minmax(280px, 380px) 1fr; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } .due { display: none; } }

  /* Video list */
  .list { display: flex; flex-direction: column; gap: 6px; }
  .list-head { margin: 2px 4px 8px; color: var(--muted); font-size: 13px; font-weight: 600; }
  .video {
    display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: center; width: 100%; padding: 8px;
    border: 1px solid transparent; border-radius: 12px; background: transparent; color: inherit; text-align: left; cursor: pointer;
    transition: background-color .15s var(--ease), border-color .15s var(--ease);
  }
  .video:hover { background: var(--surface); }
  .video[aria-current="true"] { background: var(--surface); border-color: var(--line); }
  .thumb { width: 112px; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--track) center / cover no-repeat; }
  .video-title { margin: 0; font-weight: 600; font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video-meta { margin: 2px 0 6px; color: var(--muted); font-size: 12.5px; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { padding: 1px 8px; border-radius: 10px; background: var(--track); color: var(--ink-2); font-size: 11.5px; font-weight: 600; }

  /* Detail */
  .detail { min-width: 0; padding: 24px 28px 32px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); align-self: start; }
  .detail h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.25; letter-spacing: -.015em; text-wrap: balance; }
  .detail .sub { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 16px; border-radius: 19px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 600; font-size: 14px;
    text-decoration: none; cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease);
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { margin-left: auto; color: var(--bad); }
  .tabs { display: flex; gap: 2px; margin-bottom: 20px; padding: 3px; border-radius: 11px; background: var(--track); width: fit-content; max-width: 100%; overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
  .tab[aria-selected="true"] .yta-ico { color: var(--accent); }
  .pane { max-width: 72ch; }
  .pane.wide { max-width: none; overflow-x: auto; padding-bottom: 8px; }
  .pane h3, .pane h4 { margin: 24px 0 8px; font-size: 17px; letter-spacing: -.005em; }
  .pane h3:first-child, .pane h4:first-child { margin-top: 0; }
  .pane p { margin: 0 0 10px; color: var(--ink-2); }
  .pane ul, .pane ol { padding-left: 22px; color: var(--ink-2); }
  .pane li { margin: 5px 0; }
  .pane strong { color: var(--ink); }
  a.yta-ts {
    display: inline-flex; align-items: center; padding: 0 7px; border-radius: 10px; background: var(--link-soft); color: var(--link);
    font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; text-decoration: none; white-space: nowrap;
  }
  a.yta-ts:hover { text-decoration: underline; }
  .pane-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }

  /* Flashcards and quiz, as reveal-on-click lists */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  details.card { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); }
  details.card summary { padding: 14px 16px; font-weight: 650; cursor: pointer; list-style: none; }
  details.card summary::-webkit-details-marker { display: none; }
  details.card[open] { background: var(--accent-soft); border-color: transparent; }
  details.card > div { padding: 0 16px 14px; color: var(--ink-2); font-size: 14px; }
  .quiz { padding-left: 22px; }
  .quiz > li { margin-bottom: 18px; }
  .quiz > li > p { margin: 0 0 6px; color: var(--ink); font-weight: 650; }
  .quiz ol { margin: 0 0 6px; color: var(--ink-2); }
  .quiz details summary { color: var(--link); font-size: 13.5px; font-weight: 600; cursor: pointer; }
  .quiz details p { margin: 6px 0 0; font-size: 14px; }
  .chat .msg { margin: 0 0 12px; }
  .chat .user { margin-left: auto; width: fit-content; max-width: 80%; padding: 8px 13px; border-radius: 16px 16px 4px 16px; background: var(--accent-soft); }
  .chat .user p { margin: 0; color: var(--ink); }
  .chat .ai { padding: 12px 16px; border: 1px solid var(--line); border-radius: 14px; }

  /* Courses */
  .thumb { position: relative; }
  .thumb-count { position: absolute; right: 4px; bottom: 4px; padding: 0 5px; border-radius: 4px; background: rgba(0, 0, 0, .78); color: #fff; font-size: 11px; font-weight: 600; }
  .bar { display: block; height: 4px; margin-top: 6px; border-radius: 2px; background: var(--track); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
  .bar.big { height: 6px; margin: 0 0 18px; max-width: 520px; }
  .complete { align-self: center; color: var(--good); font-weight: 600; }
  .course-list { margin: 0; padding: 0; list-style: none; max-width: 760px; }
  .course-list li { display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .course-list li a { flex: 1; min-width: 0; color: var(--ink); text-decoration: none; }
  .course-list li a:hover { text-decoration: underline; }
  .course-list li.done a { color: var(--muted); }
  .course-list small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .check { display: grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--track); color: var(--muted); font-size: 11.5px; font-weight: 700; }
  .done .check { background: var(--good); color: #fff; }
  .tag-btn { border: 0; cursor: pointer; }
  .tag-btn:hover { background: var(--accent-soft); color: var(--accent); }

  .empty { max-width: 460px; margin: 80px auto; text-align: center; color: var(--muted); }
  .empty h2 { margin: 0 0 8px; color: var(--ink); font-size: 20px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 500; }
  .toast[hidden] { display: none; }
</style>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="logo" id="logo"></span>Study Pal <small>Library</small></div>
    <input class="search" id="search" type="search" placeholder="Search your videos, notes and flashcards" aria-label="Search your library">
    <p class="due" id="due"></p>
    <button class="icon-btn" id="settings" title="Settings" aria-label="Settings"></button>
  </header>
  <div class="layout" id="layout">
    <nav class="list" id="list" aria-label="Your videos"></nav>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
  <div class="empty" id="empty" hidden>
    <h2>Your library is empty</h2>
    <p>Open any YouTube video and use Study Pal. Your notes, mind maps, flashcards and quizzes show up here, and playlists you study as courses.</p>
  </div>
  <p class="toast" id="toast" role="status" hidden></p>
  <script src="render.js"></script>
  <script src="library.js"></script>
</body>
</html>
